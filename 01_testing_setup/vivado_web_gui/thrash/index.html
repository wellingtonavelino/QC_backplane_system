<!DOCTYPE html>
<html>
<head>
    <title>Vivado Tcl Launcher</title>
    <style>
        body { font-family: sans-serif; padding: 2em; max-width: 800px; margin: auto; }
        button, input, select { font-size: 16px; margin-top: 10px; padding: 8px; width: 100%; }
        textarea { width: 100%; height: 300px; margin-top: 10px; font-family: monospace; }
        .status { margin-top: 20px; font-weight: bold; }
        table { margin-top: 30px; border-collapse: collapse; width: 100%; }
        th, td { padding: 6px; border: 1px solid #ccc; text-align: center; font-size: 9pt; }
    </style>
</head>
<body>
    <h1>Vivado Tcl Launcher (Live)</h1>
    <form method="POST">
        <label for="vivado_path">Vivado Executable Path:</label>
        <input type="text" id="vivado_path" name="vivado_path" value="{{ vivado_path }}" placeholder="e.g. C:\Xilinx\Vivado\2023.2\bin\vivado.bat" required>

        <label for="tcl_script">Choose Tcl Script:</label>
        <select id="tcl_script" name="tcl_script" required {% if running %}disabled{% endif %}>
            {% for script in script_list %}
                <option value="{{ script }}" {% if script == tcl_script %}selected{% endif %}>{{ script }}</option>
            {% endfor %}
        </select>

        <button type="submit" {% if running %}disabled{% endif %}>Run Script</button>
    </form>

    <div class="status">Status: {{ status }}</div>

    <label for="log_output">Live Vivado Output:</label>
    <textarea id="log_output" readonly></textarea>

    {% if result_table %}
        <h2>iBERT Results</h2>
        <div>{{ result_table | safe }}</div>
    {% endif %}

    <script>
        const logBox = document.getElementById("log_output");
        const source = new EventSource("/logs");
        source.onmessage = function(e) {
            logBox.value += e.data + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        };
    </script>
</body>
</html>
